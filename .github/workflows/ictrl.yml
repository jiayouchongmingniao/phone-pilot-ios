# Builds the iCTRL runner from a pinned upstream commit and signs it for one iPhone.
#
# The two jobs are separate on purpose. `build` runs upstream's Makefile and scripts, so it gets no secrets.
# `sign` holds the App Store Connect key, so it runs only this repository's code and never executes what `build` made.
#
# This repository is public. A signed IPA contains the device id, so it is only ever uploaded encrypted, and nothing
# device-specific is printed. See demo/ictrl-integration.md for the secrets and how to install the result.
name: iCTRL build

on:
  push:
    branches: [ictrl-ci, codex/phone-pilot-demo]
    paths:
      - .github/workflows/ictrl.yml
      - demo/ictrl_setup.py
      - demo/third_party/sign-ipa.sh
      - demo/tikpal-app/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ictrl-build
  cancel-in-progress: false

env:
  ICTRL_COMMIT: c1e4268859ba858d1579f7b846a56cb40641b7f6 # v1.98.16
  BUNDLE_PREFIX: io.tikpal

jobs:
  build:
    name: 编译（不签名，无密钥）
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          repository: OpenMinis/iCTRL
          ref: ${{ env.ICTRL_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: tikpal
          persist-credentials: false
      - name: 改造成 Tikpal（改名、一键恢复、内置隧道）
        run: python3 tikpal/demo/tikpal-app/apply.py .
      - name: Xcode 版本
        run: xcodebuild -version
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 换成自己的 bundle id 前缀
        # An explicit App ID is unique across all teams, so upstream's com.openminis prefix can't be registered here.
        run: |
          sed -i '' -E "s/^ICTRL_BUNDLE_PREFIX.*/ICTRL_BUNDLE_PREFIX = $BUNDLE_PREFIX/" Config/Signing.xcconfig
          grep '^ICTRL_BUNDLE_PREFIX' Config/Signing.xcconfig
      - name: 编译并打包
        shell: bash
        run: |
          set -o pipefail
          make ipa UNSIGNED=1 2>&1 | tail -n 80
      - name: 检查产物
        shell: bash
        run: |
          set -euo pipefail
          for ipa in iCTRLUITests-Runner iCTRL; do
            work="$(mktemp -d)"
            unzip -q "release/$ipa.ipa" -d "$work"
            id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$work"/Payload/*.app/Info.plist)"
            echo "$ipa: $id"
            case "$id" in "$BUNDLE_PREFIX".*) ;; *) echo "bundle id 不在 $BUNDLE_PREFIX 下"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ictrl-unsigned
          path: release/*.ipa
          retention-days: 1
          if-no-files-found: error

  sign:
    name: 签名（加密上传）
    needs: build
    runs-on: macos-15
    env:
      IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
      ICTRL_ARTIFACT_PASSWORD: ${{ secrets.ICTRL_ARTIFACT_PASSWORD }}
    steps:
      - name: 检查密钥
        id: secrets
        shell: bash
        run: |
          if [ -z "$IPHONE_UDID" ] || [ -z "$ICTRL_ARTIFACT_PASSWORD" ]; then
            echo "::notice::缺少 IPHONE_UDID 或 ICTRL_ARTIFACT_PASSWORD，只编译不签名（见 demo/ictrl-integration.md）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: ictrl-unsigned
          path: unsigned
      - name: 准备临时钥匙串
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          ICTRL_DEV_P12_B64: ${{ secrets.ICTRL_DEV_P12_B64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/ictrl.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "::add-mask::$KC_PASS"
          echo "KC_PASS=$KC_PASS" >> "$GITHUB_ENV"
          echo "ICTRL_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          if [ -n "$ICTRL_DEV_P12_B64" ]; then
            P12="$RUNNER_TEMP/existing.p12"
            printf '%s' "$ICTRL_DEV_P12_B64" | base64 -D > "$P12"
            security import "$P12" -k "$KC" -P "$ICTRL_ARTIFACT_PASSWORD" -T /usr/bin/codesign
            rm -f "$P12"
          fi
      - name: 准备证书、设备和描述文件
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ICTRL_P12_PASSWORD: ${{ secrets.ICTRL_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$KEY")
          python3 demo/ictrl_setup.py provision --yes \
            --key-file "$KEY" --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER_ID" \
            --udid "$IPHONE_UDID" --app-id "$BUNDLE_PREFIX.*" --tikpal-app "$BUNDLE_PREFIX.ictrl" \
            --export-p12 "$RUNNER_TEMP/dev-cert.p12"
          # Without this, codesign waits for a keychain dialog nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$ICTRL_KEYCHAIN" > /dev/null
      - name: 签名
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # The image goes in here and not in `build`: this job's output is encrypted, and that one's is public.
          bash demo/tikpal-app/prepare-ipa.sh unsigned/iCTRLUITests-Runner.ipa unsigned/iCTRL.ipa
          SETUP="$HOME/.ictrl/setup"
          # stdout names the team and profile; this log is public.
          LC_ALL=C bash demo/third_party/sign-ipa.sh -i unsigned/iCTRLUITests-Runner.ipa \
            -p "$SETUP/phone-pilot.mobileprovision" -o "$RUNNER_TEMP/out/iCTRLUITests-Runner-signed.ipa" > /dev/null
          echo "runner: 已签名"
          LC_ALL=C bash demo/third_party/sign-ipa.sh -i unsigned/iCTRL.ipa \
            -p "$SETUP/tikpal-app.mobileprovision" -x "$SETUP/tikpal-tunnel.mobileprovision" \
            -o "$RUNNER_TEMP/out/iCTRL-signed.ipa" > /dev/null
          echo "app: 已签名"
      - name: 打包并加密
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ ! -f "$RUNNER_TEMP/dev-cert.p12" ] || mv "$RUNNER_TEMP/dev-cert.p12" "$RUNNER_TEMP/out/dev-cert.p12"
          tar -cf "$RUNNER_TEMP/bundle.tar" -C "$RUNNER_TEMP/out" .
          mkdir -p encrypted
          /usr/bin/openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/bundle.tar" \
            -out encrypted/ictrl-signed.tar.enc -pass env:ICTRL_ARTIFACT_PASSWORD
          rm -rf "$RUNNER_TEMP/out" "$RUNNER_TEMP/bundle.tar"
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: ictrl-signed
          path: encrypted/ictrl-signed.tar.enc
          retention-days: 3
          if-no-files-found: error
      - name: 清理
        if: always()
        shell: bash
        run: |
          [ -z "${ICTRL_KEYCHAIN:-}" ] || security delete-keychain "$ICTRL_KEYCHAIN" || true
          rm -rf "$HOME/.ictrl" "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/AuthKey.p8
